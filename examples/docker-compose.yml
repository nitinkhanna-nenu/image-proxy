services:
  image-proxy:
    # Replace the image with the one you want to use, preferably overwrite the tag `latest` with a specific
    # version to avoid unexpected breaking changes, especially in production environments 
    image: ghcr.io/stax124/image-proxy:latest
    ports:
      # Replace the first part with the port you want to use on your local machine
      - "8000:8000"
    volumes:
      # Replace the first part with the path to your local images directory.
      # Local originals when IMAGE_PROXY_STORAGE=volume (the default).
      # Image bytes come from S3 when IMAGE_PROXY_STORAGE=s3, or from foyer when it is foyer.
      - ./images:/app/data
      # Uncomment with IMAGE_PROXY_ENABLE_DISK_CACHE=true. The directory must be writable by uid 1000.
      # - ./cache:/var/cache/image-proxy
    # Pass configuration in the environment. Do not bake secrets into the image.
    # See the configuration docs, .env.template, and examples/prexels/ for a full deployment.
    # environment:
    #   IMAGE_PROXY_STORAGE: s3
    #   IMAGE_PROXY_S3_BUCKET: photos
    #   IMAGE_PROXY_S3_REGION: us-east-1
    #   IMAGE_PROXY_S3_PREFIX: originals
    #   IMAGE_PROXY_S3_ACCESS_KEY_ID: ${IMAGE_PROXY_S3_ACCESS_KEY_ID}
    #   IMAGE_PROXY_S3_SECRET_ACCESS_KEY: ${IMAGE_PROXY_S3_SECRET_ACCESS_KEY}
    #   IMAGE_PROXY_S3_SECURITY_TOKEN: ${IMAGE_PROXY_S3_SECURITY_TOKEN:-}
    #   IMAGE_PROXY_UPLOAD_TOKEN: ${IMAGE_PROXY_UPLOAD_TOKEN:-}
    #   IMAGE_PROXY_BACKEND_URL: https://api.example.com
    #   IMAGE_PROXY_BACKEND_TIMEOUT: "30"
    #   IMAGE_PROXY_ENABLE_CACHE: "true"
    #   IMAGE_PROXY_PREFERRED_FORMATS: avif,webp